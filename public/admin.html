<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bailey Admin Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      color: white;
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 1rem;
      opacity: 0.9;
    }

    .dashboard {
      display: grid;
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .status-card {
      background: white;
    }

    .status-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .status-item:last-child {
      border-bottom: none;
    }

    .status-label {
      font-weight: 600;
      color: #333;
    }

    .status-value {
      color: #667eea;
      font-weight: 500;
    }

    .badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .badge.connected {
      background: #d4edda;
      color: #155724;
    }

    .badge.disconnected {
      background: #f8d7da;
      color: #721c24;
    }

    .qr-container {
      background: #f8f9fa;
      border: 2px solid #dee2e6;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      margin: 20px 0;
    }

    #qrCode {
      max-width: 300px;
      margin: 0 auto;
    }

    .qr-message {
      color: #667eea;
      font-weight: 600;
      margin-bottom: 15px;
      font-size: 0.95rem;
    }

    h2 {
      color: #333;
      font-size: 1.3rem;
      margin-bottom: 15px;
      border-bottom: 2px solid #667eea;
      padding-bottom: 10px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.95rem;
      transition: border-color 0.3s;
    }

    input:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.3s;
    }

    .btn-primary {
      background: #667eea;
      color: white;
    }

    .btn-primary:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: #e9ecef;
      color: #333;
    }

    .btn-secondary:hover {
      background: #dee2e6;
    }

    .btn-danger {
      background: #dc3545;
      color: white;
    }

    .btn-danger:hover {
      background: #c82333;
    }

    .btn-success {
      background: #28a745;
      color: white;
    }

    .btn-success:hover {
      background: #218838;
    }

    .loading {
      display: none;
      text-align: center;
      color: #667eea;
      font-weight: 600;
      padding: 20px;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 10px;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    .alert {
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
      border-left: 4px solid;
    }

    .alert.success {
      background: #d4edda;
      border-color: #28a745;
      color: #155724;
    }

    .alert.error {
      background: #f8d7da;
      border-color: #dc3545;
      color: #721c24;
    }

    .alert.info {
      background: #d1ecf1;
      border-color: #17a2b8;
      color: #0c5460;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .two-col {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 1.8rem;
      }

      .button-group {
        grid-template-columns: 1fr;
      }
    }

    .groups-list {
      list-style: none;
    }

    .groups-list li {
      padding: 10px;
      background: #f8f9fa;
      margin-bottom: 8px;
      border-radius: 6px;
      border-left: 4px solid #667eea;
      cursor: pointer;
      transition: background 0.3s;
    }

    .groups-list li:hover {
      background: #e9ecef;
    }

    .group-name {
      font-weight: 600;
      color: #333;
    }

    .group-id {
      font-size: 0.85rem;
      color: #999;
      word-break: break-all;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🚀 Bailey Admin Dashboard</h1>
      <p class="subtitle">WhatsApp Automation Control Panel</p>
    </header>

    <div class="dashboard">
      <!-- Status Section -->
      <div class="card status-card">
        <h2>Connection Status</h2>
        <div id="statusContainer">
          <div class="status-item">
            <span class="status-label">Status</span>
            <span class="loading">
              <span class="spinner"></span>
              Loading...
            </span>
          </div>
        </div>
      </div>

      <!-- QR Code Section -->
      <div class="card" id="qrSection" style="display: none;">
        <h2>Scan QR Code</h2>
        <p class="qr-message">📱 Scan with WhatsApp to authenticate</p>
        <div class="qr-container">
          <div id="qrCode"></div>
        </div>
        <div class="button-group">
          <button class="btn-secondary" onclick="reconnect()">Reconnect</button>
          <button class="btn-danger" onclick="logout()">Logout</button>
        </div>
      </div>

      <!-- Admin Controls Section -->
      <div class="card" id="controlsSection" style="display: none;">
        <h2>Admin Controls</h2>

        <!-- Send to Phone -->
        <div class="two-col">
          <div>
            <h3 style="font-size: 1rem; margin-bottom: 15px; color: #333;">📱 Send Message to Phone</h3>
            <div class="form-group">
              <label>Phone Number</label>
              <input type="tel" id="phoneInput" placeholder="92XXXXXXXXXX">
            </div>
            <div class="form-group">
              <label>Message</label>
              <textarea id="messageInput" placeholder="Type your message..."></textarea>
            </div>
            <div class="button-group">
              <button class="btn-primary" onclick="sendMessage()">Send</button>
              <button class="btn-secondary" onclick="clearMessage()">Clear</button>
            </div>
          </div>

          <!-- Send to Group -->
          <div>
            <h3 style="font-size: 1rem; margin-bottom: 15px; color: #333;">👥 Send to Group</h3>
            <div class="form-group">
              <label>Select Group</label>
              <select id="groupSelect">
                <option value="">Loading groups...</option>
              </select>
            </div>
            <div class="form-group">
              <label>Message</label>
              <textarea id="groupMessageInput" placeholder="Type your message..."></textarea>
            </div>
            <div class="button-group">
              <button class="btn-primary" onclick="sendGroupMessage()">Send</button>
              <button class="btn-secondary" onclick="loadGroups()">Refresh Groups</button>
            </div>
          </div>
        </div>

        <!-- Admin Buttons -->
        <div class="button-group" style="margin-top: 30px;">
          <button class="btn-secondary" onclick="reconnect()">🔄 Reconnect</button>
          <button class="btn-danger" onclick="logout()">🚪 Logout</button>
        </div>
      </div>

      <!-- Alerts -->
      <div id="alertContainer"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode.js/1.5.3/qrcode.min.js"></script>
  <script>
    const API_SECRET = prompt("Enter API_SECRET (leave blank if none):") || "";
    const API_URL = "http://localhost:3001";

    function getHeaders() {
      return {
        "Content-Type": "application/json",
        ...(API_SECRET && { "Authorization": `Bearer ${API_SECRET}` })
      };
    }

    function showAlert(message, type = "info") {
      const alert = document.createElement("div");
      alert.className = `alert ${type}`;
      alert.textContent = message;
      const container = document.getElementById("alertContainer");
      container.innerHTML = "";
      container.appendChild(alert);
      setTimeout(() => container.removeChild(alert), 5000);
    }

    async function loadStatus() {
      try {
        const response = await fetch(`${API_URL}/admin/status`, { headers: getHeaders() });
        const data = await response.json();

        const statusContainer = document.getElementById("statusContainer");
        statusContainer.innerHTML = `
          <div class="status-item">
            <span class="status-label">WhatsApp Status</span>
            <span class="badge ${data.connected ? "connected" : "disconnected"}">
              ${data.connected ? "✓ Connected" : "✗ Disconnected"}
            </span>
          </div>
          <div class="status-item">
            <span class="status-label">Phone</span>
            <span class="status-value">${data.phone || "Not connected"}</span>
          </div>
          <div class="status-item">
            <span class="status-label">Session</span>
            <span class="status-value">${data.hasSession ? "✓ Saved" : "✗ No session"}</span>
          </div>
        `;

        document.getElementById("qrSection").style.display = data.hasQR ? "block" : "none";
        document.getElementById("controlsSection").style.display = data.connected ? "block" : "none";

        if (data.qr && data.hasQR) {
          const qrContainer = document.getElementById("qrCode");
          qrContainer.innerHTML = "";
          new QRCode(qrContainer, data.qr);
        }

        if (data.connected) {
          loadGroups();
        }
      } catch (error) {
        showAlert(`Error: ${error.message}`, "error");
      }
    }

    async function loadGroups() {
      try {
        const response = await fetch(`${API_URL}/messages/fetch-groups`, { headers: getHeaders() });
        const data = await response.json();
        const select = document.getElementById("groupSelect");

        if (data.groups && data.groups.length > 0) {
          select.innerHTML = data.groups.map(g => `
            <option value="${g.id}">${g.subject} (${g.participantCount})</option>
          `).join("");
        } else {
          select.innerHTML = '<option value="">No groups found</option>';
        }
      } catch (error) {
        showAlert(`Error loading groups: ${error.message}`, "error");
      }
    }

    async function sendMessage() {
      const phone = document.getElementById("phoneInput").value;
      const message = document.getElementById("messageInput").value;

      if (!phone || !message) {
        showAlert("Please fill in both fields", "error");
        return;
      }

      try {
        const response = await fetch(`${API_URL}/messages/send`, {
          method: "POST",
          headers: getHeaders(),
          body: JSON.stringify({ phone, message })
        });

        if (response.ok) {
          showAlert("Message sent successfully!", "success");
          document.getElementById("messageInput").value = "";
        } else {
          const error = await response.json();
          showAlert(`Error: ${error.error}`, "error");
        }
      } catch (error) {
        showAlert(`Error: ${error.message}`, "error");
      }
    }

    async function sendGroupMessage() {
      const groupId = document.getElementById("groupSelect").value;
      const message = document.getElementById("groupMessageInput").value;

      if (!groupId || !message) {
        showAlert("Please select a group and enter a message", "error");
        return;
      }

      try {
        const response = await fetch(`${API_URL}/messages/send-group`, {
          method: "POST",
          headers: getHeaders(),
          body: JSON.stringify({ groupId, message })
        });

        if (response.ok) {
          showAlert("Group message sent successfully!", "success");
          document.getElementById("groupMessageInput").value = "";
        } else {
          const error = await response.json();
          showAlert(`Error: ${error.error}`, "error");
        }
      } catch (error) {
        showAlert(`Error: ${error.message}`, "error");
      }
    }

    async function reconnect() {
      try {
        const response = await fetch(`${API_URL}/admin/reconnect`, {
          method: "POST",
          headers: getHeaders()
        });

        if (response.ok) {
          showAlert("Reconnecting...", "info");
          setTimeout(loadStatus, 1000);
        }
      } catch (error) {
        showAlert(`Error: ${error.message}`, "error");
      }
    }

    async function logout() {
      if (!confirm("Are you sure? You'll need to scan QR code again.")) return;

      try {
        const response = await fetch(`${API_URL}/admin/logout`, {
          method: "POST",
          headers: getHeaders()
        });

        if (response.ok) {
          showAlert("Logged out. Refreshing...", "info");
          setTimeout(loadStatus, 1000);
        }
      } catch (error) {
        showAlert(`Error: ${error.message}`, "error");
      }
    }

    function clearMessage() {
      document.getElementById("messageInput").value = "";
    }

    // Load status on page load
    loadStatus();

    // Refresh status every 10 seconds
    setInterval(loadStatus, 10000);
  </script>
</body>
</html>
