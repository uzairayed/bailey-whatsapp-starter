<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sample Registration Form</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      color: #333;
      font-size: 1.8rem;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #999;
      font-size: 0.95rem;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }

    input,
    select {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #ddd;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.95rem;
      transition: border-color 0.3s;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    input[type="radio"],
    input[type="checkbox"] {
      width: auto;
      margin-right: 8px;
    }

    .radio-group,
    .checkbox-group {
      display: flex;
      gap: 20px;
      margin-top: 8px;
    }

    .radio-label,
    .checkbox-label {
      display: flex;
      align-items: center;
      font-weight: 400;
      cursor: pointer;
    }

    .time-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    button:active {
      transform: translateY(0);
    }

    .alert {
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
      border-left: 4px solid;
    }

    .alert.success {
      background: #d4edda;
      border-color: #28a745;
      color: #155724;
    }

    .alert.error {
      background: #f8d7da;
      border-color: #dc3545;
      color: #721c24;
    }

    .alert.loading {
      background: #d1ecf1;
      border-color: #17a2b8;
      color: #0c5460;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #f3f3f3;
      border-top: 2px solid #0c5460;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    .required {
      color: #dc3545;
    }

    .help-text {
      font-size: 0.85rem;
      color: #999;
      margin-top: 4px;
    }

    @media (max-width: 600px) {
      .card {
        padding: 25px;
      }

      h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <header>
        <h1>Registration Form</h1>
        <p class="subtitle">Sign up to receive WhatsApp updates</p>
      </header>

      <div id="alertContainer"></div>

      <form id="registrationForm" onsubmit="handleSubmit(event)">
        <div class="form-group">
          <label>Name <span class="required">*</span></label>
          <input type="text" name="name" required placeholder="John Doe">
        </div>

        <div class="form-group">
          <label>Phone Number <span class="required">*</span></label>
          <input type="tel" name="phone" required placeholder="92XXXXXXXXXX">
          <p class="help-text">Format: Pakistan (+92) without spaces</p>
        </div>

        <div class="form-group">
          <label>Gender <span class="required">*</span></label>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="gender" value="male" required> Male
            </label>
            <label class="radio-label">
              <input type="radio" name="gender" value="female" required> Female
            </label>
          </div>
        </div>

        <div class="form-group">
          <label>Role <span class="required">*</span></label>
          <select name="role" required>
            <option value="">-- Select Role --</option>
            <option value="driver">Driver</option>
            <option value="passenger">Passenger</option>
            <option value="both">Both</option>
          </select>
        </div>

        <div class="form-group">
          <label>Pickup Location <span class="required">*</span></label>
          <input type="text" name="pickupLocation" required placeholder="e.g., Defence, Karachi">
        </div>

        <div class="form-group">
          <label>Office Location <span class="required">*</span></label>
          <input type="text" name="officeLocation" required placeholder="e.g., DHA, Karachi">
        </div>

        <div class="form-group">
          <label>Preferred Times</label>
          <div class="time-inputs">
            <div>
              <label style="margin-bottom: 4px; font-size: 0.9rem;">Pickup Time</label>
              <input type="time" name="pickupTime" placeholder="08:00">
            </div>
            <div>
              <label style="margin-bottom: 4px; font-size: 0.9rem;">Drop Time</label>
              <input type="time" name="dropTime" placeholder="18:00">
            </div>
          </div>
        </div>

        <button type="submit">Register & Receive WhatsApp Invite</button>

        <div style="text-align: center; margin-top: 20px; color: #999; font-size: 0.9rem;">
          By registering, you'll receive a WhatsApp group invite link via your phone number.
        </div>
      </form>
    </div>
  </div>

  <script>
    const API_URL = "http://localhost:3001";

    function showAlert(message, type = "info") {
      const alert = document.createElement("div");
      alert.className = `alert ${type}`;

      if (type === "loading") {
        alert.innerHTML = `<span class="spinner"></span>${message}`;
      } else {
        alert.textContent = message;
      }

      const container = document.getElementById("alertContainer");
      container.innerHTML = "";
      container.appendChild(alert);

      if (type !== "loading") {
        setTimeout(() => container.removeChild(alert), 5000);
      }
    }

    async function handleSubmit(event) {
      event.preventDefault();

      const formData = new FormData(event.target);
      const data = {
        name: formData.get("name"),
        phone: formData.get("phone"),
        gender: formData.get("gender"),
        role: formData.get("role"),
        pickupLocation: formData.get("pickupLocation"),
        officeLocation: formData.get("officeLocation"),
        pickupTime: formData.get("pickupTime") || null,
        dropTime: formData.get("dropTime") || null
      };

      showAlert("Submitting registration...", "loading");

      try {
        const response = await fetch(`${API_URL}/api/register`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        if (response.ok) {
          showAlert(`✓ ${result.message}`, "success");
          document.getElementById("registrationForm").reset();
        } else {
          showAlert(`✗ ${result.error || "Registration failed"}`, "error");
        }
      } catch (error) {
        showAlert(`✗ Error: ${error.message}`, "error");
      }
    }
  </script>
</body>
</html>
